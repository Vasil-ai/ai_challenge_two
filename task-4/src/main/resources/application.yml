server:
  port: ${ATC_SERVER_PORT:8080}

spring:
  main:
    banner-mode: off
    web-application-type: servlet
  ai:
    mcp:
      server:
        name: atc-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: |
          AI-ready Air Traffic Control MCP server. Tools allow submitting flights,
          regenerating the airport schedule, cancelling flights, inspecting structured
          airport status and analysing the bottleneck dependency chain. Resources
          expose the flight queue, runway availability, and the chronological
          schedule timeline.
        sse-message-endpoint: ${ATC_SSE_MESSAGE_ENDPOINT:/mcp/messages}
        capabilities:
          tool: true
          resource: true
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.atc.mcp: INFO
    org.springframework.ai.mcp: INFO

atc:
  runways: ${ATC_RUNWAYS:R1:3500,R2:2500,R3:4000}
  gate-count: ${ATC_GATE_COUNT:6}
  ground-crew-count: ${ATC_GROUND_CREW_COUNT:8}
  separation:
    takeoff-seconds: ${ATC_SEPARATION_TAKEOFF_SECONDS:120}
    landing-seconds: ${ATC_SEPARATION_LANDING_SECONDS:180}
    mixed-seconds: ${ATC_SEPARATION_MIXED_SECONDS:240}
  gate-turnaround-seconds: ${ATC_GATE_TURNAROUND_SECONDS:1800}
  dependency-buffer-seconds: ${ATC_DEPENDENCY_BUFFER_SECONDS:900}
  scheduling-horizon-seconds: ${ATC_SCHEDULING_HORIZON_SECONDS:43200}
  operation-duration:
    arrival-seconds: ${ATC_OPERATION_DURATION_ARRIVAL_SECONDS:600}
    departure-seconds: ${ATC_OPERATION_DURATION_DEPARTURE_SECONDS:480}
  epoch: ${ATC_EPOCH:2026-01-01T00:00:00Z}
